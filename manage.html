<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>หน้าผู้ดูแล - จัดการคะแนน</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: "Noto Sans Thai", sans-serif; background-color: #f5f0e5; }
    .score-card { box-shadow: 0 15px 40px rgba(0,0,0,0.08); }
    
    /* สไตล์สำหรับปุ่มกรองข้อมูล */
    .filter-btn { transition: all 0.2s ease; }
    .filter-btn.active {
      background-color: #11213a; 
      color: white; 
      border-color: #11213a; 
      box-shadow: 0 4px 10px rgba(17, 33, 58, 0.2);
    }
  </style>
</head>
<body class="p-4 sm:p-8">
  
  <main class="mx-auto w-full max-w-4xl">
    <section class="score-card rounded-3xl border border-white bg-white p-6 sm:p-10">
      
      <!-- Header Section -->
      <div class="flex flex-col sm:flex-row sm:items-center justify-between mb-6 gap-4 border-b pb-6">
        <div>
            <h1 class="text-2xl font-bold flex items-center gap-3 text-[#11213a]">
                <div class="bg-red-100 text-red-600 p-2 rounded-xl"><i data-lucide="trash-2"></i></div>
                ประวัติและการลบคะแนน
            </h1>
            <p class="text-gray-500 text-sm mt-2">ค้นหาประวัติการกรอกคะแนน และกดปุ่มเพื่อลบข้อมูลที่ผิดพลาด (แสดงหน้าละ 5 รายการ)</p>
        </div>
        <button onclick="loadHistory()" class="bg-[#11213a] text-white px-5 py-2.5 rounded-full text-sm font-bold hover:bg-blue-900 transition flex items-center justify-center gap-2 shadow-sm">
            <i data-lucide="refresh-cw" id="refresh-icon" style="width:16px;height:16px"></i> <span>รีเฟรชข้อมูล</span>
        </button>
      </div>
      
      <!-- Filter Section -->
      <div class="mb-6 bg-gray-50 p-5 rounded-2xl border border-gray-200">
        
        <!-- บรรทัดที่ 1: ประเภทกีฬา -->
        <div class="mb-6">
          <p class="text-sm font-bold text-gray-700 mb-2 flex items-center gap-2"><i data-lucide="activity" style="width:16px;height:16px"></i> กรองตามประเภทกีฬา:</p>
          <div class="flex flex-wrap gap-2" id="filter-sport">
            <button class="filter-btn active border border-gray-300 bg-white text-gray-700 px-4 py-1.5 rounded-full text-sm font-medium" data-sport="ทั้งหมด">ทั้งหมด</button>
            <button class="filter-btn border border-gray-300 bg-white text-gray-700 px-4 py-1.5 rounded-full text-sm font-medium" data-sport="ฟุตบอล">ฟุตบอล</button>
            <button class="filter-btn border border-gray-300 bg-white text-gray-700 px-4 py-1.5 rounded-full text-sm font-medium" data-sport="บาสเกตบอล">บาสเกตบอล</button>
            <button class="filter-btn border border-gray-300 bg-white text-gray-700 px-4 py-1.5 rounded-full text-sm font-medium" data-sport="วิ่งผลัด">วิ่งผลัด</button>
            <button class="filter-btn border border-gray-300 bg-white text-gray-700 px-4 py-1.5 rounded-full text-sm font-medium" data-sport="ชักเย่อ">ชักเย่อ</button>
            <button class="filter-btn border border-gray-300 bg-white text-gray-700 px-4 py-1.5 rounded-full text-sm font-medium" data-sport="กองเชียร์">กองเชียร์</button>
          </div>
        </div>
        
        <!-- บรรทัดที่ 2: สีทีม -->
        <div>
          <p class="text-sm font-bold text-gray-700 mb-2 flex items-center gap-2"><i data-lucide="palette" style="width:16px;height:16px"></i> กรองตามสีทีม:</p>
          <div id="filter-color" class="flex flex-col gap-3">
            <div>
                <button class="filter-btn active border border-gray-300 bg-white text-gray-700 px-6 py-1.5 rounded-full text-sm font-medium w-full sm:w-auto" data-color="ทั้งหมด">รวมทุกสี</button>
            </div>
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-2.5">
                <button class="filter-btn border border-gray-300 bg-white text-gray-700 px-2 py-2 rounded-xl text-sm font-medium" data-color="สีแดง">❤️ สีแดง</button>
                <button class="filter-btn border border-gray-300 bg-white text-gray-700 px-2 py-2 rounded-xl text-sm font-medium" data-color="สีเหลือง">💛 สีเหลือง</button>
                <button class="filter-btn border border-gray-300 bg-white text-gray-700 px-2 py-2 rounded-xl text-sm font-medium" data-color="สีเขียว">💚 สีเขียว</button>
                <button class="filter-btn border border-gray-300 bg-white text-gray-700 px-2 py-2 rounded-xl text-sm font-medium" data-color="สีฟ้า">🩵 สีฟ้า</button>
                <button class="filter-btn border border-gray-300 bg-white text-gray-700 px-2 py-2 rounded-xl text-sm font-medium" data-color="สีม่วง">💜 สีม่วง</button>
                <button class="filter-btn border border-gray-300 bg-white text-gray-700 px-2 py-2 rounded-xl text-sm font-medium" data-color="สีส้ม">🧡 สีส้ม</button>
                <button class="filter-btn border border-gray-300 bg-white text-gray-700 px-2 py-2 rounded-xl text-sm font-medium" data-color="สีชมพู">🩷 สีชมพู</button>
                <button class="filter-btn border border-gray-300 bg-white text-gray-700 px-2 py-2 rounded-xl text-sm font-medium" data-color="สีน้ำเงิน">💙 สีน้ำเงิน</button>
            </div>
          </div>
        </div>
      </div>
      
      <!-- ตารางประวัติ พร้อมระบบแบ่งหน้า -->
      <div class="rounded-xl border border-gray-200 bg-white shadow-sm overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-sm text-left whitespace-nowrap">
            <thead class="text-xs text-gray-500 uppercase bg-gray-100 border-b border-gray-200">
              <tr>
                <th class="px-5 py-4">เวลาบันทึก</th>
                <th class="px-5 py-4">ประเภทกีฬา</th>
                <th class="px-5 py-4">สีทีม</th>
                <th class="px-5 py-4 text-center">คะแนน</th>
                <th class="px-5 py-4 text-center">จัดการ</th>
              </tr>
            </thead>
            <tbody id="history-table-body" class="divide-y divide-gray-100 bg-white">
              <tr><td colspan="5" class="text-center py-10 text-gray-500">กำลังโหลดประวัติ...</td></tr>
            </tbody>
          </table>
        </div>
        
        <!-- ส่วนแสดงปุ่มเปลี่ยนหน้า (Pagination) -->
        <div id="pagination-controls" class="flex flex-col sm:flex-row justify-between items-center gap-4 px-5 py-4 bg-gray-50 border-t border-gray-200">
            <!-- ข้อมูลหน้าจะถูกใส่โดย Javascript -->
        </div>
      </div>

    </section>
  </main>

  <script>
    // ⚠️ 1. เอา URL ของ Web App มาวางตรงนี้ ⚠️
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyJwe0GNwM3YBuprny-c9PHyfJEB6DfC-zyDUi0zjqkbFhYORaeErY6tt4kXm3K3FBi/exec';

    // ตัวแปรสำหรับระบบประวัติและการแบ่งหน้า
    let allHistoryData = [];
    let filteredData = [];
    let currentSportFilter = "ทั้งหมด";
    let currentColorFilter = "ทั้งหมด";
    
    // ตั้งค่าการแบ่งหน้า
    let currentPage = 1;
    const rowsPerPage = 5;

    // ผูก Event ให้ปุ่มกรอง กีฬา
    document.querySelectorAll('#filter-sport .filter-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            document.querySelectorAll('#filter-sport .filter-btn').forEach(b => b.classList.remove('active'));
            e.currentTarget.classList.add('active');
            currentSportFilter = e.currentTarget.dataset.sport;
            currentPage = 1; // เวลากด Filter ใหม่ ให้กลับไปหน้า 1
            renderTable(); 
        });
    });

    // ผูก Event ให้ปุ่มกรอง สี
    document.querySelectorAll('#filter-color .filter-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            document.querySelectorAll('#filter-color .filter-btn').forEach(b => b.classList.remove('active'));
            e.currentTarget.classList.add('active');
            currentColorFilter = e.currentTarget.dataset.color;
            currentPage = 1; // เวลากด Filter ใหม่ ให้กลับไปหน้า 1
            renderTable(); 
        });
    });

    // 🔵 ฟังก์ชันดึงประวัติ (GET) จาก Google Sheets
    async function loadHistory() {
        const tbody = document.getElementById('history-table-body');
        const icon = document.getElementById('refresh-icon');
        icon.classList.add('animate-spin');

        tbody.innerHTML = '<tr><td colspan="5" class="text-center py-10 text-gray-500"><div class="flex justify-center items-center gap-2"><i data-lucide="loader-2" class="animate-spin"></i> กำลังอัปเดตประวัติ...</div></td></tr>';
        document.getElementById('pagination-controls').innerHTML = '';
        if (window.lucide) lucide.createIcons();

        try {
            const response = await fetch(SCRIPT_URL + '?action=history');
            allHistoryData = await response.json(); 
            
            currentPage = 1; // โหลดข้อมูลใหม่ เริ่มที่หน้า 1
            renderTable(); 
        } catch (error) {
            tbody.innerHTML = '<tr><td colspan="5" class="text-center py-10 text-red-500">โหลดข้อมูลล้มเหลว โปรดเช็คการเชื่อมต่อ</td></tr>';
        } finally {
            icon.classList.remove('animate-spin');
        }
    }

    // ฟังก์ชันวาดตารางและจัดการระบบแบ่งหน้า (Pagination)
    function renderTable() {
        const tbody = document.getElementById('history-table-body');
        const paginationContainer = document.getElementById('pagination-controls');
        tbody.innerHTML = '';

        if(allHistoryData.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" class="text-center py-10 text-gray-400">ยังไม่มีประวัติการบันทึกคะแนนในระบบ</td></tr>';
            paginationContainer.innerHTML = '';
            return;
        }

        // 1. กรองข้อมูลตามที่แอดมินเลือก
        filteredData = allHistoryData.filter(record => {
            const matchSport = currentSportFilter === "ทั้งหมด" || record.sport === currentSportFilter;
            const matchColor = currentColorFilter === "ทั้งหมด" || record.color === currentColorFilter;
            return matchSport && matchColor;
        });

        if(filteredData.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" class="text-center py-10 text-gray-400">ไม่พบประวัติ (ตามตัวกรองที่เลือก)</td></tr>';
            paginationContainer.innerHTML = '';
            return;
        }

        // 2. คำนวณจำนวนหน้า
        const totalPages = Math.ceil(filteredData.length / rowsPerPage);
        
        // ป้องกันกรณีหน้าปัจจุบันเกินหน้าทั้งหมด (เช่น ลบข้อมูลจนหน้าสุดท้ายหายไป)
        if (currentPage > totalPages) currentPage = totalPages;
        if (currentPage < 1) currentPage = 1;

        // 3. หั่นข้อมูลเพื่อนำมาแสดงเฉพาะในหน้าปัจจุบัน (Slice Data)
        const startIndex = (currentPage - 1) * rowsPerPage;
        const endIndex = startIndex + rowsPerPage;
        const displayData = filteredData.slice(startIndex, endIndex);

        // 4. วาดตารางข้อมูล
        displayData.forEach(record => {
            const dateObj = new Date(record.timestamp);
            const timeStr = `${dateObj.getHours().toString().padStart(2, '0')}:${dateObj.getMinutes().toString().padStart(2, '0')} น.`;
            const dateStr = `${dateObj.getDate()}/${dateObj.getMonth()+1}/${dateObj.getFullYear()}`;

            let colorClass = "text-gray-700";
            if(record.color === "สีแดง") colorClass = "text-red-600 font-bold bg-red-50 px-2 py-1 rounded";
            else if(record.color === "สีฟ้า") colorClass = "text-sky-500 font-bold bg-sky-50 px-2 py-1 rounded";
            else if(record.color === "สีเหลือง") colorClass = "text-yellow-600 font-bold bg-yellow-50 px-2 py-1 rounded";
            else if(record.color === "สีเขียว") colorClass = "text-green-600 font-bold bg-green-50 px-2 py-1 rounded";
            else if(record.color === "สีม่วง") colorClass = "text-purple-600 font-bold bg-purple-50 px-2 py-1 rounded";
            else if(record.color === "สีส้ม") colorClass = "text-orange-600 font-bold bg-orange-50 px-2 py-1 rounded";
            else if(record.color === "สีชมพู") colorClass = "text-pink-600 font-bold bg-pink-50 px-2 py-1 rounded";
            else if(record.color === "สีน้ำเงิน") colorClass = "text-blue-700 font-bold bg-blue-50 px-2 py-1 rounded";

            const row = `
                <tr class="hover:bg-blue-50 transition-colors">
                    <td class="px-5 py-4 text-gray-500 font-medium">${dateStr} <span class="text-xs bg-gray-200 text-gray-700 px-2 py-0.5 rounded-full ml-1">${timeStr}</span></td>
                    <td class="px-5 py-4 font-bold text-[#11213a]">${record.sport}</td>
                    <td class="px-5 py-4"><span class="${colorClass}">${record.color}</span></td>
                    <td class="px-5 py-4 text-center font-extrabold text-xl text-gray-800">${record.points}</td>
                    <td class="px-5 py-4 text-center">
                        <button onclick="deleteRecord(${record.rowNumber}, this)" class="bg-red-50 text-red-600 px-4 py-2 rounded-xl text-sm font-bold hover:bg-red-500 hover:text-white transition-all flex items-center justify-center gap-1 mx-auto shadow-sm">
                            <i data-lucide="trash-2" style="width:16px;height:16px"></i> ลบ
                        </button>
                    </td>
                </tr>
            `;
            tbody.insertAdjacentHTML('beforeend', row);
        });

        // 5. วาดปุ่มเลื่อนหน้า (Render Pagination Controls)
        renderPaginationControls(totalPages);
        
        if (window.lucide) lucide.createIcons();
    }

    // ฟังก์ชันสร้าง UI ปุ่มแบ่งหน้า
    function renderPaginationControls(totalPages) {
        const container = document.getElementById('pagination-controls');
        
        // ถ้ามีแค่หน้าเดียว ไม่ต้องแสดงปุ่มเลื่อนหน้า แต่ให้บอกว่าเจอทั้งหมดกี่รายการ
        if (totalPages <= 1) {
            container.innerHTML = `<span class="text-sm text-gray-500 font-medium">พบทั้งหมด ${filteredData.length} รายการ</span>`;
            return;
        }

        const isPrevDisabled = currentPage === 1;
        const isNextDisabled = currentPage === totalPages;

        container.innerHTML = `
            <span class="text-sm text-gray-500 font-medium">
                แสดงหน้า <span class="font-bold text-[#11213a]">${currentPage}</span> จาก <span class="font-bold text-[#11213a]">${totalPages}</span>
                <span class="mx-2 text-gray-300">|</span>
                รวม ${filteredData.length} รายการ
            </span>
            <div class="flex gap-2">
                <button onclick="changePage(-1)" ${isPrevDisabled ? 'disabled' : ''} 
                    class="flex items-center gap-1 px-4 py-2 rounded-xl text-sm font-bold border transition-colors
                    ${isPrevDisabled ? 'bg-gray-100 text-gray-400 border-gray-200 cursor-not-allowed' : 'bg-white text-gray-700 border-gray-300 hover:bg-gray-100 hover:text-[#11213a]'}">
                    <i data-lucide="chevron-left" style="width:16px;height:16px"></i> ก่อนหน้า
                </button>
                <button onclick="changePage(1)" ${isNextDisabled ? 'disabled' : ''} 
                    class="flex items-center gap-1 px-4 py-2 rounded-xl text-sm font-bold border transition-colors
                    ${isNextDisabled ? 'bg-gray-100 text-gray-400 border-gray-200 cursor-not-allowed' : 'bg-white text-gray-700 border-gray-300 hover:bg-gray-100 hover:text-[#11213a]'}">
                    ถัดไป <i data-lucide="chevron-right" style="width:16px;height:16px"></i>
                </button>
            </div>
        `;
    }

    // ฟังก์ชันสำหรับเปลี่ยนหน้าซ้าย-ขวา
    function changePage(direction) {
        currentPage += direction;
        renderTable();
    }

    // 🟠 ฟังก์ชันลบข้อมูล (POST)
    async function deleteRecord(rowNumber, btnElement) {
        const confirmDelete = confirm("⚠️ ยืนยันการลบคะแนน?\n\nข้อมูลแถวนี้จะถูกลบออกจากระบบทันที และตารางคะแนนรวมจะถูกคำนวณใหม่");
        if (!confirmDelete) return;

        const originalText = btnElement.innerHTML;
        btnElement.innerHTML = '<i data-lucide="loader-2" class="animate-spin" style="width:16px;height:16px"></i> ลบ...';
        btnElement.disabled = true;
        if (window.lucide) lucide.createIcons();

        try {
            const payload = { action: 'delete', rowNumber: rowNumber };
            const response = await fetch(SCRIPT_URL, {
                method: "POST",
                body: JSON.stringify(payload)
            });
            const result = await response.json();
            
            if(result.status === 'success') {
                loadHistory(); 
            } else {
                alert("เกิดข้อผิดพลาด: " + result.message);
                btnElement.innerHTML = originalText;
                btnElement.disabled = false;
            }
        } catch (error) {
            alert("ไม่สามารถเชื่อมต่อกับเซิร์ฟเวอร์ได้");
            btnElement.innerHTML = originalText;
            btnElement.disabled = false;
        }
    }

    // โหลดครั้งแรกตอนเปิดเว็บ
    document.addEventListener("DOMContentLoaded", function() {
      if (window.lucide) window.lucide.createIcons();
      loadHistory();
    });
  </script>
</body>
</html>
